name: savora_app
description: Savora — premium cloud kitchen app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - lib/core/localization/en.json
    - lib/core/localization/ar.json
    - lib/core/localization/es.json
    - lib/core/localization/fr.json
    - lib/core/localization/zh.json
