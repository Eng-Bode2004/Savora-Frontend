name: savora_app
description: Savora — premium cloud kitchen app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  google_fonts: ^6.2.1
  http: ^1.2.0
  image_picker: ^1.2.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - lib/core/localization/en.json
    - lib/core/localization/ar.json
    - lib/core/localization/es.json
    - lib/core/localization/fr.json
    - lib/core/localization/zh.json

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
